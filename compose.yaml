services:
  redis:
    image: redis:7
    container_name: ticketing-redis
    ports:
      - "6379:6379"
  mailpit:
    image: axllent/mailpit
    container_name: ticketing-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  postgres:
    image: postgres:17
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - account_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  account_postgres_data: